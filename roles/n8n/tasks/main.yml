---
# Run n8n natively on the host (not in a container) so the Execute Command node
# reaches Kali's own tools. Node.js from NodeSource, n8n pinned via npm, a
# dedicated system user, systemd unit + env file, Caddy on the host.
# Restarts happen only when the env file, unit, or n8n version change.

# --- Node.js (NodeSource, pinned major) -------------------------------------

- name: Add the NodeSource GPG key
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

# NodeSource publishes a distro-agnostic suite ("nodistro"), so Kali's own
# codename is not a problem here. Written whole (not apt_repository) so a
# change of nodejs_major replaces the old major's line instead of adding one.
- name: Add the NodeSource apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/nodesource.list
    owner: root
    group: root
    mode: "0644"
    content: |
      deb [arch=arm64 signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_major }}.x nodistro main
  register: nodesource_repo

# Kali ships its own nodejs. Pin NodeSource above it so apt never swaps the
# runtime under n8n on a routine upgrade.
- name: Pin NodeSource packages above the distro nodejs
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/nodesource
    owner: root
    group: root
    mode: "0644"
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 1001

- name: Read the installed Node.js major
  ansible.builtin.command:
    argv: [node, -p, "process.versions.node.split('.')[0]"]
  register: node_major_before
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install native-module build prerequisites
  ansible.builtin.apt:
    name:
      - build-essential
      - python3
      - python3.13
      - git
    state: present
    update_cache: "{{ nodesource_repo is changed }}"

# `latest` only when the installed major differs from nodejs_major, so a
# routine run never moves Node.js and a major bump actually upgrades it.
- name: Install Node.js at the pinned major
  ansible.builtin.apt:
    name: nodejs
    state: "{{ 'present' if node_major_before.stdout | default('') == nodejs_major | string else 'latest' }}"
    update_cache: "{{ nodesource_repo is changed }}"

# --- Service user and directories ------------------------------------------

- name: Create the n8n group
  ansible.builtin.group:
    name: "{{ n8n_group }}"
    system: true

# Home is n8n_dir so tools that write under $HOME (nuclei, amass, etc.) land
# somewhere persistent and owned by the service user.
- name: Create the n8n service user (docker group member)
  ansible.builtin.user:
    name: "{{ n8n_user }}"
    group: "{{ n8n_group }}"
    groups: docker
    append: true
    system: true
    home: "{{ n8n_dir }}"
    create_home: false
    shell: /bin/bash

- name: Create the n8n install directory
  ansible.builtin.file:
    path: "{{ n8n_dir }}"
    state: directory
    owner: "{{ n8n_user }}"
    group: "{{ n8n_group }}"
    mode: "0750"

# The data directory is the ENTIRE trust boundary: it holds the credentials
# and the auto-generated encryption key that decrypts them. 0700, owned by the
# service user. This is the one thing to back up (encrypted, off the box).
- name: Create the n8n data directory (the trust boundary)
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}"
    state: directory
    owner: "{{ n8n_user }}"
    group: "{{ n8n_group }}"
    mode: "0700"

- name: Create the loot directory
  ansible.builtin.file:
    path: "{{ loot_dir }}"
    state: directory
    owner: "{{ n8n_user }}"
    group: "{{ n8n_group }}"
    mode: "0750"

- name: Create the n8n config directory
  ansible.builtin.file:
    path: "{{ n8n_env_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# --- n8n (pinned, global npm install) ---------------------------------------

# isolated-vm has no arm64 prebuild and compiles from source. Its headers use
# uint32_t without including <cstdint>, which GCC 15+ no longer pulls in
# transitively, so force-include it.
- name: Install n8n globally at the pinned version
  community.general.npm:
    name: n8n
    version: "{{ n8n_version }}"
    global: true
    state: present
  environment:
    NODE_ENV: production
    CXXFLAGS: "-include cstdint"
  notify: Restart n8n

- name: Resolve the global node_modules directory
  ansible.builtin.command:
    cmd: npm root -g
  register: npm_root
  changed_when: false
  check_mode: false

# Native modules (isolated-vm, sqlite3) are built against one Node.js ABI. When
# the major changed underneath an existing install, rebuild them in place.
- name: Rebuild n8n native modules after a Node.js major change
  ansible.builtin.command:
    cmd: npm rebuild
    chdir: "{{ npm_root.stdout | trim }}/n8n"
  environment:
    NODE_ENV: production
    CXXFLAGS: "-include cstdint"
  when:
    - node_major_before.rc == 0
    - node_major_before.stdout | length > 0
    - node_major_before.stdout != nodejs_major | string
  notify: Restart n8n

# --- Python task runner (internal mode) -------------------------------------
# The n8n npm package does not ship the Python runner; n8n's Docker images build
# it separately. n8n expects it at <npm root>/@n8n/task-runner-python with a
# .venv inside, and runs `python -m src.main` from that directory.

- name: Expose the Python runner directory as a fact
  ansible.builtin.set_fact:
    n8n_py_runner_dir: "{{ npm_root.stdout | trim }}/@n8n/task-runner-python"

- name: Read the installed uv version
  ansible.builtin.command:
    argv: [/usr/local/bin/uv, --version]
  register: uv_installed
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install uv at the pinned version
  when: uv_installed.rc != 0 or uv_version not in uv_installed.stdout
  block:
    - name: Create a scratch directory for the uv download
      ansible.builtin.tempfile:
        state: directory
      register: uv_tmp

    - name: Download the uv release (checksum verified)
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-aarch64-unknown-linux-gnu.tar.gz"
        checksum: "sha256:https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-aarch64-unknown-linux-gnu.tar.gz.sha256"
        dest: "{{ uv_tmp.path }}/uv.tar.gz"
        mode: "0644"

    - name: Unpack uv
      ansible.builtin.unarchive:
        src: "{{ uv_tmp.path }}/uv.tar.gz"
        dest: "{{ uv_tmp.path }}"
        remote_src: true

    - name: Install the uv binary
      ansible.builtin.copy:
        src: "{{ uv_tmp.path }}/uv-aarch64-unknown-linux-gnu/uv"
        dest: /usr/local/bin/uv
        remote_src: true
        owner: root
        group: root
        mode: "0755"
  always:
    - name: Remove the uv scratch directory
      ansible.builtin.file:
        path: "{{ uv_tmp.path }}"
        state: absent
      when: uv_tmp.path is defined

- name: Read the Python runner's source version marker
  ansible.builtin.command:
    argv: [cat, "{{ n8n_py_runner_dir }}/.n8n-version"]
  register: py_runner_marker
  changed_when: false
  check_mode: false
  failed_when: false

# Rebuilt only when the pinned n8n version changes, so the runner always
# matches the n8n it talks to.
- name: Build the Python task runner for this n8n version
  when: py_runner_marker.stdout | default('') | trim != n8n_version
  notify: Restart n8n
  block:
    - name: Create a scratch directory for the runner source
      ansible.builtin.tempfile:
        state: directory
      register: py_runner_tmp

    - name: Sparse-clone n8n at the pinned release tag
      ansible.builtin.command:
        argv:
          - git
          - clone
          - --quiet
          - --depth=1
          - --filter=blob:none
          - --sparse
          - --branch
          - "n8n@{{ n8n_version }}"
          - https://github.com/n8n-io/n8n.git
          - "{{ py_runner_tmp.path }}/n8n"

    - name: Check out only the Python runner package
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ py_runner_tmp.path }}/n8n"
          - sparse-checkout
          - set
          - packages/@n8n/task-runner-python

    - name: Remove any previous Python runner
      ansible.builtin.file:
        path: "{{ n8n_py_runner_dir }}"
        state: absent

    - name: Install the Python runner source
      ansible.builtin.copy:
        src: "{{ py_runner_tmp.path }}/n8n/packages/@n8n/task-runner-python/"
        dest: "{{ n8n_py_runner_dir }}/"
        remote_src: true
        owner: root
        group: root
        mode: preserve
        directory_mode: "0755"

    # Same sync n8n's runners image uses, against the distro Python the
    # runner is pinned to. Copy mode keeps the venv independent of root's cache.
    - name: Build the Python runner virtual environment
      ansible.builtin.command:
        argv:
          - /usr/local/bin/uv
          - sync
          - --frozen
          - --no-dev
          - --all-extras
          - --no-editable
          - --python
          - "{{ n8n_py_runner_python }}"
        chdir: "{{ n8n_py_runner_dir }}"
      environment:
        UV_PYTHON_DOWNLOADS: never
        UV_LINK_MODE: copy

    - name: Record the n8n version the runner was built for
      ansible.builtin.copy:
        dest: "{{ n8n_py_runner_dir }}/.n8n-version"
        content: "{{ n8n_version }}\n"
        owner: root
        group: root
        mode: "0644"
  always:
    - name: Remove the runner scratch directory
      ansible.builtin.file:
        path: "{{ py_runner_tmp.path }}"
        state: absent
      when: py_runner_tmp.path is defined

- name: Resolve the global npm prefix
  ansible.builtin.command:
    cmd: npm prefix -g
  register: npm_prefix
  changed_when: false
  check_mode: false

- name: Expose the n8n binary path as a fact
  ansible.builtin.set_fact:
    n8n_bin: "{{ npm_prefix.stdout | trim }}/bin/n8n"

# --- Runtime configuration --------------------------------------------------

# Root-owned, group-readable by the service: nothing secret in here (the
# encryption key is generated by n8n into the data dir), but it is the service
# definition and nobody else needs it.
- name: Template the n8n environment file
  ansible.builtin.template:
    src: n8n.env.j2
    dest: "{{ n8n_env_file }}"
    owner: root
    group: "{{ n8n_group }}"
    mode: "0640"
  notify: Restart n8n

- name: Template the n8n systemd unit
  ansible.builtin.template:
    src: n8n.service.j2
    dest: /etc/systemd/system/n8n.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart n8n

# Passwordless sudo for the raw-socket scanners only. The docker group already
# makes this user root-equivalent, so this widens nothing; it just saves the
# workflows from having to shell out through a container for SYN scans.
- name: Grant the n8n user passwordless sudo for the listed scanners
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/n8n
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  when: n8n_sudo_commands | length > 0

- name: Enable and start n8n
  ansible.builtin.systemd:
    name: n8n
    enabled: true
    state: started
    daemon_reload: true

# --- Caddy (host package, official repo) ------------------------------------

- name: Add the Caddy GPG key
  ansible.builtin.get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    owner: root
    group: root
    mode: "0644"

# "any-version" is Caddy's distro-agnostic suite; Kali's codename is fine.
- name: Add the Caddy apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    filename: caddy-stable
    state: present
    update_cache: true

- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Template the Caddyfile (reverse proxy vhost)
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: "/usr/bin/caddy validate --adapter caddyfile --config %s"
  notify: Reload caddy

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
