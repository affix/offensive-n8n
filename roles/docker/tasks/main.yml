---
# Install Docker CE from Docker's official apt repo (NOT distro docker.io),
# built for arm64 using docker_apt_codename.

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Add Docker apt repository (arm64, pinned to Debian base codename)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian {{ docker_apt_codename }} stable
    filename: docker
    state: present
    update_cache: true

- name: Install Docker CE engine, CLI, containerd, buildx and compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start the Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add the connecting user to the docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
