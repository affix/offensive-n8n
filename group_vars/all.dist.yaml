---
# Copy to group_vars/all.yaml and set your values. all.yaml is gitignored.
# ----------------------------------------------------------------------------
# All tunables for the n8n-on-Kali build. Every image reference is pinned to
# an explicit tag. `latest` is prohibited anywhere in this project.
# ----------------------------------------------------------------------------

# --- Network / exposure -----------------------------------------------------

# LAN address n8n binds to. Set to the host's LAN IP to reach it from other hosts.
# Use 127.0.0.1 to make n8n reachable on-box only (no LAN exposure at all).
n8n_bind_ip: "192.168.1.10"

# Host port the n8n editor/webhooks are published on (direct, behind Caddy).
n8n_port: 5678

# Caddy reverse proxy: the vhost it serves and the host port it publishes.
# n8n is reached as http://{{ n8n_hostname }} once DNS points this name at the host.
n8n_hostname: "n8n.lan.example.com"
caddy_http_port: 80

# Set true when n8n sits behind an external reverse proxy (e.g. TLS on another
# host). n8n then advertises n8n_public_url for editor links and webhooks and
# trusts n8n_proxy_hops proxies' X-Forwarded-* headers. When false, n8n
# advertises http://n8n_bind_ip:n8n_port and the two settings below are unused.
n8n_behind_proxy: false
n8n_proxy_hops: 1

# Public URL n8n advertises when n8n_behind_proxy is true. This is the external
# front door (e.g. a TLS reverse proxy), NOT the on-box Caddy vhost. Webhook
# URLs and editor links n8n generates use this.
n8n_public_host: "n8n.example.com"
n8n_public_url: "https://n8n.example.com"

# The ONLY source range permitted inbound to SSH (22), the n8n port, and the
# Caddy HTTP port. Everything else is dropped by the default-deny firewall.
lan_mgmt_cidr: "192.168.1.0/24"

# Extra sources allowed to reach the n8n port only (not SSH or Caddy), e.g. the
# address a remote reverse proxy's traffic arrives from over a tunnel. Use the
# narrowest CIDR possible. Empty list adds no rule.
n8n_proxy_cidrs: []

# Extra TCP ports opened to lan_mgmt_cidr only (e.g. a service on the host that
# is not managed here). Empty list adds no rule.
lan_extra_tcp_ports: []

# Timezone applied to the host and exported to the n8n service.
timezone: "Europe/London"

# --- Paths ------------------------------------------------------------------

# Install path for n8n. Also the service user's home and N8N_USER_FOLDER, so
# n8n's state (sqlite DB, credentials, encryption key) lives in n8n_data_dir.
n8n_dir: "/opt/n8n"
n8n_data_dir: "{{ n8n_dir }}/.n8n"

# Environment file consumed by the systemd unit.
n8n_env_file: "/etc/n8n/n8n.env"

# Loot / output path. The only tree the Read/Write Files node may touch.
loot_dir: "/opt/loot"

# --- Service identity -------------------------------------------------------

# n8n runs natively on the host (not in a container) as this system user, so
# the Execute Command node runs Kali's own tools directly. The user is a member
# of the docker group (root-equivalent) and may sudo the commands listed below.
n8n_user: "n8n"
n8n_group: "n8n"

# Commands the n8n user may run via `sudo -n` without a password (full paths
# only). Raw-socket scanners need root for SYN scans.
n8n_sudo_commands:
  - /usr/bin/nmap
  - /usr/bin/masscan
  - /usr/bin/naabu

# n8n 2.x excludes Execute Command, Read/Write Files and Local File Trigger by
# default. An empty list re-enables them. Host command execution is the whole
# reason n8n runs on the host, so this stays empty.
n8n_nodes_exclude: "[]"

# --- Runtime versions (all pinned) ------------------------------------------

# n8n version installed globally with npm.
n8n_version: "2.42.3"

# Node.js major from NodeSource. n8n 2.42 refuses to start below Node.js 24.
nodejs_major: 24

# uv release used to build the Python task runner's venv (matches n8n's
# runners image).
uv_version: "0.8.14"

# Interpreter for the Python task runner. The runner pins Python 3.13.
n8n_py_runner_python: "/usr/bin/python3.13"

# Python Code node import allowlists. "*" allows the whole stdlib; the
# Execute Command node already gives a shell, so this widens nothing.
# External packages stay off unless listed (and installed in the runner venv).
n8n_py_stdlib_allow: "*"
n8n_py_external_allow: ""

# Kali-native tool packages installed on the host for the Execute Command node.
# Keep to packages kali-rolling ships for both arm64 and amd64.
kali_tool_packages:
  - nmap
  - masscan
  - nuclei
  - subfinder
  - httpx-toolkit
  - naabu
  - katana
  - dnsx
  - ffuf
  - feroxbuster
  - gobuster
  - sqlmap
  - nikto
  - wpscan
  - amass
  - gowitness
  - whatweb
  - trufflehog
  - gitleaks
  - seclists
  - jq

# --- Container images (all pinned) ------------------------------------------

# Image used to register cross-arch binfmt handlers (qemu).
binfmt_image: "tonistiigi/binfmt:qemu-v8.1.5"

# Host path for persisted nuclei templates (refreshed with the host nuclei).
nuclei_templates_dir: "/opt/nuclei-templates"

# --- Docker apt repo --------------------------------------------------------

# Kali reports its own codename (e.g. "kali-rolling"), which Docker does NOT
# publish a repo for. Set this to the Debian base Kali currently tracks:
# bookworm (Debian 12) or trixie (Debian 13).
docker_apt_codename: "trixie"

# --- SSH hardening ----------------------------------------------------------

# Gate on the SSH lockdown. Keep OFF for the first run so a misconfigured key
# cannot lock the operator out. Flip to true once key auth is confirmed working.
harden_ssh: false

# --- autossh tunnel ---------------------------------------------------------

# Persistent SSH tunnel held open by autossh as a systemd service. Off by default.
autossh_enabled: false
autossh_service_name: "autossh-tunnel"

# Local account the tunnel runs as. Its key and known_hosts are used as-is.
autossh_user: "kali"
autossh_identity_file: "/home/kali/.ssh/id_ed25519"

# SSH destination (user@host) and port.
autossh_remote: "user@remote.example.com"
autossh_remote_port: 22

# ssh -L specs: [bind_address:]port:host:hostport. host is resolved on the
# remote end. Bind to n8n_bind_ip (and list the port in lan_extra_tcp_ports)
# to reach the forward from the management LAN; 127.0.0.1 keeps it on-box.
autossh_local_forwards:
  - "127.0.0.1:9200:127.0.0.1:9200"

# --- PostgreSQL (workflow data store) ---------------------------------------

# PostgreSQL in Docker Compose for data n8n workflows store via the Postgres
# node. n8n's own state stays in sqlite. Off by default.
postgres_enabled: false
postgres_image: "postgres:18.4-trixie"

# Compose file, data directory and the generated password file live here.
# Read the password with: sudo cat {{ postgres_dir }}/postgres_password
postgres_dir: "/opt/postgres"

# Loopback only: the host-native n8n connects to 127.0.0.1. Docker-published
# ports bypass the nftables input chain, so do not bind a LAN address here.
postgres_bind_ip: "127.0.0.1"
postgres_port: 5432

postgres_db: "n8n_data"
postgres_user: "n8n"

# uid of the postgres user inside the official image.
postgres_container_uid: 999

# Server settings passed as -c flags. Sized for an 8GB host shared with n8n.
postgres_shm_size: "256mb"
postgres_settings:
  shared_buffers: "1GB"
  effective_cache_size: "3GB"
  work_mem: "32MB"
  maintenance_work_mem: "256MB"
  max_connections: 50

# --- Ghidra (headless, for patch diffing) -----------------------------------

# Pinned upstream release. Take the SHA-256 from the release notes. The JDK
# minimum comes from Ghidra/application.properties (application.java.min=21).
ghidra_enabled: false
ghidra_version: "12.1.4"
ghidra_release_date: "20260921"
ghidra_sha256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"

# Gradle the bundled wrapper downloads to build the arm64 natives
# (support/gradle/gradle-wrapper.properties of the pinned release).
ghidra_gradle_sha256: "acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a"

# Versions install side by side here; GHIDRA_INSTALL_DIR is the symlink.
ghidra_base_dir: "/opt/ghidra"
ghidra_install_dir: "{{ ghidra_base_dir }}/current"

# Kali's default-jdk is 25; Ghidra is pinned to this one via JAVA_HOME_OVERRIDE.
ghidra_jdk_package: "openjdk-21-jdk-headless"
ghidra_java_home: "/usr/lib/jvm/java-21-openjdk-{{ deb_arch }}"

# Java heap for headless analysis and ghidriff: total RAM minus 3GB, floor 2GB.
# The Pi also runs n8n and postgres (shared_buffers 1GB); Ollama is remote.
ghidra_maxmem: "{{ [ansible_memtotal_mb - 3072, 2048] | max }}m"

# Service user that runs analysis (owns ~/.config/ghidra, read-only on the install).
ghidra_user: "{{ n8n_user }}"

# Keep the previous version after an upgrade. Cached Ghidra projects (the
# per-product ghidriff projects under the patchdiff loot dir) are upgraded on
# open by a newer Ghidra and can no longer be opened by the old one, so only
# set this false once the new version has run cleanly.
ghidra_keep_previous: true

# --- Patch diff pipeline ----------------------------------------------------

# Job scripts, uv project and tool config. Runs under the PD n8n workflows.
patchdiff_enabled: false
patchdiff_dir: "/opt/patchdiff"
patchdiff_loot_dir: "{{ loot_dir }}/patchdiff"

# Interpreter for the patchdiff venv. JPype 1.5.2 (pinned by pyghidra) has no
# Python 3.14 wheel and Kali's system Python is 3.14, so stay on 3.13.
patchdiff_python: "/usr/bin/python3.13"

# ghidriff from a pinned commit: PyPI 1.0.0 predates Ghidra 12 and has a
# markdown crash fixed on main. pyghidra comes from the Ghidra release itself.
patchdiff_ghidriff_ref: "4f5d895fcbb1eacd65efd81145922c15bb7e741d"
patchdiff_pyghidra_version: "3.1.0"
patchdiff_python_deps:
  - "httpx==0.28.1"
  - "packaging==26.3"
  - "unidiff==1.0.1"

# jadx (arch-neutral zip) for JAR/APK decompilation.
patchdiff_jadx_version: "1.5.6"
patchdiff_jadx_sha256: "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974"

# Unpacking sandbox for non-plain archives (run with --network none). The
# image index includes linux/arm64, so no emulation.
patchdiff_unblob_image: "ghcr.io/onekey-sec/unblob:26.6.4@sha256:0779adc4fc7751c601eaaa2eaae1ad04279a8afadecb36af4315752b72f5e2f9"

# ilspycmd (.NET decompiler) built into a local image on the pinned .NET SDK.
# ilspycmd 11.x targets net10.0 only; the SDK index includes linux/arm64.
patchdiff_ilspy_version: "11.1.0.9782"
patchdiff_dotnet_sdk_image: "mcr.microsoft.com/dotnet/sdk:10.0.401-noble@sha256:e70cdb7f80b0348f5cb85f19a8f670fca061f033d57eed12fa003d58b0e06317"

# Ollama used by pd_triage (same endpoint and model as ASM · 07 Triage).
patchdiff_ollama_url: "http://10.20.0.2:11434"
patchdiff_ollama_model: "huihui_ai/qwen3.5-abliterated:9b"

# Host unpackers kept for manual triage; the scripts sandbox anything that is
# not a plain zip/tar/deb in the unblob container.
patchdiff_packages:
  - 7zip
  - msitools
  - cabextract
  - unzip
  - rpm2cpio
  - cpio
  - binutils
  - zstd
  - git
  - jq
